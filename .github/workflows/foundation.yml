name: Foundation model validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,llm]'
      - run: python -m pytest services/api/tests
        env:
          AI_HOME_ENVIRONMENT: test
      - run: python -m ai_home.foundation.smoke --output-dir artifacts/foundation-smoke --device cpu
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-smoke
          path: artifacts/foundation-smoke/
