name: Foundation model validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,llm]'
      - run: python -m pytest services/api/tests
        env:
          AI_HOME_ENVIRONMENT: test
      - run: python -m ai_home.foundation.smoke --output-dir artifacts/foundation-smoke --device cpu
      - run: python -m ai_home.foundation.smoke_package build artifacts/foundation-smoke artifacts/foundation-nano-smoke.zip --revision "$GITHUB_SHA"
      - run: python -m ai_home.foundation.smoke_package verify artifacts/foundation-nano-smoke.zip
      - run: python -m pip install . --no-deps --force-reinstall
      - run: python -I -m ai_home.network_probe_smoke --output-dir artifacts/installed-transfer-probe
      - run: python -I -m ai_home.foundation.vision_smoke --output-dir artifacts/installed-visual --device cpu
      - name: Install virtual display for real Tk navigation
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Verify installed desktop control sections
        run: xvfb-run -a python -I scripts/verify_desktop_sections.py --require-installed
      - name: Verify visual stream isolation on profile switch
        run: xvfb-run -a python -I scripts/verify_visual_profile.py --require-installed
      - name: Verify real desktop visual training and cancellation
        run: xvfb-run -a python -I scripts/verify_visual_training.py --require-installed --dataset artifacts/installed-visual/dataset.json --output-dir artifacts/installed-visual-ui
      - name: Verify desktop node registration and real gradient work
        run: xvfb-run -a python -I scripts/verify_desktop_node.py --require-installed --output-dir artifacts/installed-desktop-node --device cpu
      - run: python -I scripts/verify_installed_api.py --output-dir artifacts/installed-api --checkpoint artifacts/foundation-smoke/foundation-nano.pt
      - run: python -I -m ai_home.foundation.distributed_smoke --output-dir artifacts/installed-distributed --rounds 2 --reward-credits 3 --worker-devices cpu cpu --restart-coordinator --transfer-scheduling
      - uses: actions/upload-artifact@v4
        with:
          name: installed-runtime-reports
          path: |
            artifacts/installed-api/report.json
            artifacts/installed-distributed/report.json
            artifacts/installed-transfer-probe/report.json
            artifacts/installed-desktop-node/report.json
            artifacts/installed-visual-ui/training/training-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-nano-smoke-package
          path: artifacts/foundation-nano-smoke.zip
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-smoke
          path: artifacts/foundation-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: artifacts/installed-visual/
