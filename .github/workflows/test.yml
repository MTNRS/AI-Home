name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_home_test
          POSTGRES_USER: ai_home
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_home -d ai_home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_HOME_ENVIRONMENT: test
      AI_HOME_DATABASE_URL: postgresql+psycopg://ai_home:test-password@localhost:5432/ai_home_test
      AI_HOME_TEST_POSTGRES_URL: postgresql+psycopg://ai_home:test-password@localhost:5432/ai_home_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
