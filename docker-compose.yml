services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_home
      POSTGRES_USER: ai_home
      POSTGRES_PASSWORD: ${AI_HOME_POSTGRES_PASSWORD:?Set AI_HOME_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ai_home_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_home -d ai_home"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_home_postgres:
